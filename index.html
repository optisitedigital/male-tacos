<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malé Tacos - Commande</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <img src="logo-male.png" alt="Logo Malé Tacos" class="logo-header">
        <h1>Malé Tacos</h1>
        <div class="mode-selector">
            <button id="btn-retrait" class="tab-btn active" onclick="switchMode('retrait')">Retrait École</button>
            <button id="btn-livraison" class="tab-btn" onclick="switchMode('livraison')">Livraison Directe</button>
        </div>
    </header>

    <main>
        <section id="menu-retrait">
            <h2 class="title-section">🔥 TARIFS ÉLÈVES 🔥</h2>
            <div class="item">
                <div class="info">
                    <h3>Tacos Standard (5.000 FC)</h3>
                    <input type="number" id="q-std" value="0" min="0" class="qty-input">
                </div>
            </div>
            <div class="item">
                <div class="info">
                    <h3>Cannibal Viande (4.000 FC)</h3>
                    <input type="number" id="q-can" value="0" min="0" class="qty-input">
                </div>
            </div>
        </section>

        <section id="menu-livraison" style="display:none;">
            <h2 class="title-section">🛵 MENU LIVRAISON 🛵</h2>
            <div class="zone-box">
                📍 **Livraison :** UPN, Cité Verte, Macampagne, Kitambo Magasin.
            </div>
            
            <div class="item">
                <img src="tacos-viande.jpg" alt="Tacos Viande">
                <div class="info">
                    <h3>Tacos Viande Hachée</h3>
                    <label class="check-container">
                        <input type="checkbox" id="v-l"> Taille L - **12.000 FC**
                    </label>
                    <label class="check-container">
                        <input type="checkbox" id="v-xl"> Taille XL - **24.000 FC**
                    </label>
                </div>
            </div>

            <div class="item">
                <img src="tacos-poulet.jpg" alt="Tacos Poulet">
                <div class="info">
                    <h3>Tacos au Poulet</h3>
                    <label class="check-container">
                        <input type="checkbox" id="p-l"> Taille L - **10.000 FC**
                    </label>
                    <label class="check-container">
                        <input type="checkbox" id="p-xl"> Taille XL - **20.000 FC**
                    </label>
                </div>
            </div>
        </section>

        <section id="infos-client">
            <input type="text" id="nom" placeholder="Nom et Prénom" required>

            <div id="fields-retrait">
                <input type="text" id="classe" placeholder="Ta Classe">
                <p class="label-info">Jour et Heure de retrait :</p>
                <input type="date" id="date-recup">
                <select id="h-retrait">
                    <option value="Récréation (10h)">Récréation (10h00)</option>
                    <option value="Sortie (12h30)">Sortie (12h30)</option>
                </select>
            </div>

            <div id="fields-livraison" style="display:none;">
                <input type="text" id="commune" placeholder="Commune">
                <input type="text" id="avenue" placeholder="Quartier et Avenue">
                <input type="text" id="num-maison" placeholder="N° Maison et Référence">
                <p class="loc-alert">🚀 Frais de livraison : 6.000 FC</p>
            </div>
        </section>

        <button class="btn-whatsapp" onclick="envoyer()">📲 Commander via WhatsApp</button>
    </main>

    <script>
        let mode = "retrait";

        function switchMode(m) {
            mode = m;
            document.getElementById('btn-retrait').className = (m === 'retrait' ? 'tab-btn active' : 'tab-btn');
            document.getElementById('btn-livraison').className = (m === 'livraison' ? 'tab-btn active' : 'tab-btn');
            document.getElementById('menu-retrait').style.display = (m === 'retrait' ? 'block' : 'none');
            document.getElementById('menu-livraison').style.display = (m === 'livraison' ? 'block' : 'none');
            document.getElementById('fields-retrait').style.display = (m === 'retrait' ? 'block' : 'none');
            document.getElementById('fields-livraison').style.display = (m === 'livraison' ? 'block' : 'none');
        }

        function envoyer() {
            const nom = document.getElementById('nom').value;
            if(!nom) return alert("Mets ton nom !");

            let commande = "";
            let entete = "";

            if(mode === "retrait") {
                const qS = document.getElementById('q-std').value;
                const qC = document.getElementById('q-can').value;
                if(qS > 0) commande += `%0A- ${qS} Tacos Standard`;
                if(qC > 0) commande += `%0A- ${qC} Cannibal`;
                entete = `*RETRAIT ECOLE*%0A👤 Nom: ${nom}%0A🏫 Classe: ${document.getElementById('classe').value}%0A📅 Date: ${document.getElementById('date-recup').value}%0A⏰ Heure: ${document.getElementById('h-retrait').value}`;
            } else {
                if(document.getElementById('v-l').checked) commande += "%0A- Tacos Viande L (12.000 FC)";
                if(document.getElementById('v-xl').checked) commande += "%0A- Tacos Viande XL (24.000 FC)";
                if(document.getElementById('p-l').checked) commande += "%0A- Tacos Poulet L (10.000 FC)";
                if(document.getElementById('p-xl').checked) commande += "%0A- Tacos Poulet XL (20.000 FC)";
                
                entete = `*LIVRAISON DIRECTE 🚀*%0A👤 Nom: ${nom}%0A📍 Commune: ${document.getElementById('commune').value}%0A📍 Quartier/Av: ${document.getElementById('avenue').value}%0A🏠 N°: ${document.getElementById('num-maison').value}%0A📍 _Envoi localisation après ce message._`;
            }

            if(commande === "") return alert("Coche au moins un Tacos !");
            
            const texte = `Salut Malé Tacos ! 🌮%0A%0A${entete}%0A%0A*COMMANDE :*${commande}`;
            window.open(`https://wa.me/243858679024?text=${texte}`, '_blank');
        }
    </script>
</body>
</html>
