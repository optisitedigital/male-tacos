<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malé Tacos - Bobokoli</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <img src="logo-male.png" alt="Logo Malé Tacos" class="logo-header">
        <h1>Malé Tacos</h1>
        <p>Grande première à Bobokoli ! 🌮</p>
    </header>

    <main>
        <section id="menu">
            <h2 class="title-section">🔥 TARIFS ÉLÈVES 🔥</h2>

            <div class="item">
                <img src="standard.jpg" alt="Tacos standard">
                <div class="info">
                    <h3>Tacos Standard</h3>
                    <p class="price">5 000 FC</p>
                    <input type="number" id="qty-standard" value="0" min="0" class="qty-input">
                </div>
            </div>

            <div class="item">
                <img src="cannibal.jpg" alt="Cannibal Burger">
                <div class="info">
                    <h3>Cannibal (Viande hachée)</h3>
                    <p class="price">4 000 FC</p>
                    <input type="number" id="qty-cannibal" value="0" min="0" class="qty-input">
                </div>
            </div>

            <div class="item">
                <img src="spaghetti.jpg" alt="Spaghetti">
                <div class="info">
                    <h3>Spaghetti Bolognaise</h3>
                    <p class="price">3 000 FC</p>
                    <input type="number" id="qty-spag" value="0" min="0" class="qty-input">
                </div>
            </div>

            <div class="item">
                <img src="burger.jpg" alt="Burger">
                <div class="info">
                    <h3>Burger</h3>
                    <p class="price">3 000 FC</p>
                    <input type="number" id="qty-burger" value="0" min="0" class="qty-input">
                </div>
            </div>
        </section>

        <section id="infos-client">
            <h2>Tes Informations</h2>
            <input type="text" id="nom" placeholder="Nom et Prénom" required>
            <input type="text" id="classe" placeholder="Ta Classe" required>
            
            <p class="label-info">Quand viens-tu récupérer ?</p>
            <select id="creneau">
                <option value="06h00 - 06h15">Matin (06h00 à 06h15)</option>
                <option value="07h10 - 07h15">Pré-Récré (07h10 à 07h15)</option>
                <option value="10h00 - 10h13">Récréation (10h00 à 10h13)</option>
                <option value="12h30 (Sortie)">Sortie (12h30)</option>
            </select>
        </section>

        <button class="btn-whatsapp" onclick="envoyerWhatsApp()">📲 Commander maintenant</button>
    </main>

    <script>
        function envoyerWhatsApp() {
            const nom = document.getElementById('nom').value;
            const classe = document.getElementById('classe').value;
            const creneau = document.getElementById('creneau').value;
            
            const s = document.getElementById('qty-standard').value;
            const c = document.getElementById('qty-cannibal').value;
            const sp = document.getElementById('qty-spag').value;
            const b = document.getElementById('qty-burger').value;
            
            if(!nom || !classe) {
                alert("STP, entre ton nom et ta classe !");
                return;
            }

            let commande = "";
            if(s > 0) commande += `%0A- *${s}* Tacos Standard`;
            if(c > 0) commande += `%0A- *${c}* Cannibal (Viande)`;
            if(sp > 0) commande += `%0A- *${sp}* Spaghetti`;
            if(b > 0) commande += `%0A- *${b}* Burger`;

            if(commande === "") {
                alert("Choisis au moins un article !");
                return;
            }

            const texte = `Salut Malé Tacos ! 🌮%0A%0A*Nouvelle commande de :*%0A${nom} (${classe})%0A%0A*Détails :*${commande}%0A%0A*Récupération prévue :*%0A${creneau}`;
            
            const numero = "243858679024"; 
            window.open(`https://wa.me/${numero}?text=${texte}`, '_blank');
        }
    </script>
</body>
</html>
