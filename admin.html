<!DOCTYPE html>
<html lang="fr">
<head>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@500;600;700;800&display=swap');
:root{--red:#a9002b;--red2:#d20b3d;--red3:#7e0020;--ink:#141414;--muted:#686868;--paper:#fff;--soft:#fff5f7;--line:#eee5e8;--green:#159447;--shadow:0 20px 60px rgba(40,5,18,.12);--radius:24px;--max:1180px}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth;scroll-padding-top:86px}body{font-family:Inter,Arial,sans-serif;background:#fff;color:var(--ink);overflow-x:hidden}button,input,select{font:inherit}button{cursor:pointer;border:0}a{text-decoration:none;color:inherit}img{max-width:100%;display:block}.container{width:min(var(--max),calc(100% - 36px));margin:auto}
/* TikTok / in-app browser gate */
body.inapp-lock>*:not(#browserGate){display:none!important}.browser-gate{position:fixed;inset:0;z-index:9999;background:#fff;display:none;align-items:center;justify-content:center;padding:24px}.browser-gate.show{display:flex}.gate-card{width:min(460px,100%);border-radius:28px;background:#fff;border:1px solid #f1dce2;box-shadow:0 25px 80px rgba(169,0,43,.12);padding:34px 26px;text-align:center;animation:gateIn .55s cubic-bezier(.2,.9,.2,1)}.gate-brand{font-weight:900;font-size:24px;color:var(--red);margin-bottom:28px}.gate-line{width:72px;height:5px;border-radius:9px;background:var(--red);margin:0 auto 24px}.gate-card h1{font-family:Manrope,Inter,sans-serif;font-size:28px;line-height:1.12;margin-bottom:12px}.gate-card p{color:#5f5f5f;line-height:1.65}.gate-steps{text-align:left;background:var(--soft);border:1px solid #f5d8e0;border-radius:18px;padding:18px;margin:22px 0}.gate-step{display:flex;gap:12px;align-items:flex-start;padding:8px 0;line-height:1.45}.gate-num{flex:0 0 30px;height:30px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800}.gate-btn{width:100%;background:var(--red);color:#fff;padding:15px 18px;border-radius:14px;font-weight:800;box-shadow:0 12px 28px rgba(169,0,43,.22)}.gate-note{font-size:12px;margin-top:12px;color:#8a777d!important}@keyframes gateIn{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:none}}
/* header */
.topbar{height:34px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;letter-spacing:.02em}.header{height:76px;position:sticky;top:0;z-index:80;background:rgba(255,255,255,.9);backdrop-filter:blur(18px);border-bottom:1px solid rgba(238,229,232,.8)}.header-inner{height:100%;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px}.brand img{width:42px;height:42px;border-radius:12px;object-fit:cover}.brand strong{font-family:Manrope,Inter,sans-serif;font-size:20px;letter-spacing:-.04em}.brand small{display:block;color:var(--red);font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;margin-top:1px}.header-actions{display:flex;align-items:center;gap:10px}.header-order{display:inline-flex;padding:11px 16px;border-radius:12px;background:var(--red);color:#fff;font-weight:800;font-size:13px}.hamburger{width:48px;height:48px;border-radius:14px;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.hamburger span{width:21px;height:2px;border-radius:5px;background:var(--ink);transition:.25s}.hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}.hamburger.open span:nth-child(2){opacity:0}.hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(20,0,7,.46);z-index:89;opacity:0;pointer-events:none;transition:.3s}.scrim.show{opacity:1;pointer-events:auto}.drawer{position:fixed;left:0;top:0;bottom:0;width:min(390px,88vw);z-index:90;background:#fff;transform:translateX(-105%);transition:transform .42s cubic-bezier(.2,.9,.2,1);box-shadow:25px 0 70px rgba(0,0,0,.18);padding:28px}.drawer.show{transform:none}.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}.drawer-close{width:40px;height:40px;border-radius:50%;background:#f7eef1;color:var(--red);font-size:20px}.drawer-brand{font-weight:900;color:var(--red);font-size:20px}.drawer-nav{display:grid;gap:7px}.drawer-nav button,.drawer-nav a{padding:16px;border-radius:14px;text-align:left;font-weight:800;color:#292326;background:transparent}.drawer-nav button:hover,.drawer-nav a:hover{background:var(--soft);color:var(--red)}.drawer-nav .accent{background:var(--red);color:#fff}.drawer-info{margin-top:auto;padding-top:26px;color:#777;font-size:12px;line-height:1.6}
/* hero */
.hero{position:relative;min-height:620px;overflow:hidden;background:linear-gradient(135deg,#fff 0%,#fff 58%,#fff4f6 100%)}.hero:before{content:"";position:absolute;width:540px;height:540px;right:-190px;top:-180px;border-radius:50%;background:rgba(169,0,43,.06);filter:blur(3px)}.hero-inner{min-height:620px;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:45px;position:relative}.hero-copy{padding:60px 0}.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:var(--soft);color:var(--red);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.12em;animation:rise .7s both}.eyebrow:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red)}.hero h1{font-family:Manrope,Inter,sans-serif;font-size:clamp(42px,5vw,72px);line-height:.98;letter-spacing:-.065em;max-width:650px;margin:22px 0 20px;animation:rise .7s .08s both}.hero h1 span{color:var(--red)}.hero-sub{font-size:17px;line-height:1.7;color:#666;max-width:520px;animation:rise .7s .16s both}.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px;animation:rise .7s .24s both}.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:14px;padding:15px 20px;font-weight:900;transition:.25s}.btn-red{background:var(--red);color:#fff;box-shadow:0 15px 35px rgba(169,0,43,.22)}.btn-red:hover{transform:translateY(-3px);background:var(--red2)}.btn-light{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn-light:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.hero-meta{display:flex;gap:20px;margin-top:27px;color:#777;font-size:12px;font-weight:700;animation:rise .7s .32s both}.hero-meta strong{display:block;color:#1c1719;font-size:13px;margin-bottom:2px}.hero-product{position:relative;height:560px;display:flex;align-items:center;justify-content:center;animation:heroImg .9s .18s both}.hero-product:before{content:"";position:absolute;width:460px;height:460px;border-radius:50%;background:linear-gradient(145deg,#fff,#f9dfe5);box-shadow:inset 0 0 0 1px rgba(169,0,43,.08)}.hero-product img{position:relative;width:min(520px,100%);height:500px;object-fit:contain;filter:drop-shadow(0 35px 28px rgba(40,5,18,.2));animation:float 5s ease-in-out infinite}.hero-tag{position:absolute;right:3%;bottom:65px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 17px;box-shadow:var(--shadow);font-weight:900;animation:rise .7s .5s both}.hero-tag small{display:block;color:#777;font-size:10px;font-weight:600;margin-top:3px}
/* Nouvelle présentation : le catalogue reste caché jusqu'au choix de commande */
.command-choice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.command-choice{position:relative;text-align:left;background:#fff;border:1px solid var(--line);border-radius:28px;padding:30px;min-height:290px;overflow:hidden;transition:transform .35s cubic-bezier(.2,.9,.2,1),box-shadow .35s,border-color .35s}
.command-choice:before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;right:-100px;bottom:-110px;background:var(--soft);transition:transform .5s}
.command-choice:hover{transform:translateY(-8px);box-shadow:0 28px 70px rgba(60,5,20,.13);border-color:#e9c4ce}.command-choice:hover:before{transform:scale(1.3)}
.command-choice-dark{background:linear-gradient(135deg,#a9002b,#7e0020);color:#fff;border-color:transparent}.command-choice-dark:before{background:rgba(255,255,255,.09)}
.command-choice-top{display:flex;justify-content:space-between;position:relative;z-index:1;font-size:11px;font-weight:900;letter-spacing:.12em}.choice-arrow{font-size:24px;line-height:1}
.command-icon{font-size:40px;margin:25px 0 8px;position:relative;z-index:1}.command-choice h3{font-family:Manrope;font-size:27px;letter-spacing:-.04em;position:relative;z-index:1}
.command-choice p{max-width:430px;margin:10px 0 22px;color:#777;line-height:1.65;font-size:13px;position:relative;z-index:1}.command-choice-dark p{color:rgba(255,255,255,.75)}.command-choice strong{font-size:13px;position:relative;z-index:1}.command-choice strong span{margin-left:7px}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center}.about-copy h2{font-family:Manrope;font-size:clamp(34px,4vw,53px);line-height:1;letter-spacing:-.055em;margin:10px 0 20px}.about-copy>p{color:#6d686a;line-height:1.75;max-width:570px}
.about-points{display:grid;gap:14px;margin-top:28px}.about-points>div{display:grid;grid-template-columns:42px 1fr;column-gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}.about-points span{grid-row:1/3;color:var(--red);font-size:11px;font-weight:900}.about-points strong{font-size:14px}.about-points small{color:#777;margin-top:4px;font-size:12px}
.about-visual{position:relative;min-height:510px;border-radius:30px;overflow:hidden;background:#f7e7eb}.about-visual img{width:100%;height:100%;min-height:510px;object-fit:cover;transition:transform .8s}.about-visual:hover img{transform:scale(1.04)}
.floating-note{position:absolute;left:22px;bottom:22px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);padding:16px 18px;border-radius:16px;box-shadow:var(--shadow)}.floating-note strong{display:block;font-size:14px}.floating-note span{display:block;font-size:11px;color:#777;margin-top:4px}
.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.feature-card{position:relative;background:#fff;border:1px solid var(--line);border-radius:24px;padding:26px;min-height:235px;overflow:hidden;transition:.3s}.feature-card:hover{transform:translateY(-6px);box-shadow:var(--shadow)}
.feature-number{color:var(--red);font-size:11px;font-weight:900;letter-spacing:.12em}.feature-symbol{position:absolute;right:18px;top:16px;font-family:Manrope;font-size:75px;font-weight:900;color:rgba(169,0,43,.055)}.feature-card h3{font-family:Manrope;font-size:21px;margin-top:48px}.feature-card p{color:#777;line-height:1.65;font-size:13px;margin-top:10px}
.order-modal{position:fixed;inset:0;z-index:200;display:none;align-items:flex-end;justify-content:center}.order-modal.show{display:flex}.order-modal-backdrop{position:absolute;inset:0;background:rgba(20,0,7,.58);backdrop-filter:blur(7px);animation:fade .25s}
.order-modal-panel{position:relative;width:min(1100px,calc(100% - 24px));max-height:min(92vh,900px);overflow:auto;background:#fff;border-radius:30px 30px 0 0;padding:28px;margin-top:auto;box-shadow:0 -30px 100px rgba(0,0,0,.25);animation:orderPanelIn .45s cubic-bezier(.2,.9,.2,1)}
.order-modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:18px}.order-modal-head h2{font-family:Manrope;font-size:clamp(28px,4vw,40px);letter-spacing:-.05em;margin-top:5px}
.order-modal-close{width:44px;height:44px;border-radius:50%;background:#f7eef1;color:var(--red);font-size:25px;transition:.2s}.order-modal-close:hover{transform:rotate(90deg);background:var(--red);color:#fff}
.order-modal-switch{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:25px;padding:5px;background:#faf5f6;border-radius:15px;width:max-content;max-width:100%}.modal-switch{padding:11px 15px;border-radius:11px;background:transparent;font-weight:900;color:#777}.modal-switch.active{background:var(--red);color:#fff;box-shadow:0 8px 20px rgba(169,0,43,.18)}
.order-modal .menu-panel{display:none}.order-modal .menu-panel.active{display:block}@keyframes orderPanelIn{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:none}}
/* sections */
.section{padding:92px 0}.section-soft{background:#fff7f8}.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:34px}.section-kicker{color:var(--red);font-size:11px;text-transform:uppercase;letter-spacing:.13em;font-weight:900}.section h2{font-family:Manrope,Inter,sans-serif;font-size:clamp(30px,4vw,46px);letter-spacing:-.05em;margin-top:7px}.section-head p{max-width:450px;color:#747074;line-height:1.65;font-size:14px}.choice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.choice{position:relative;border:1px solid var(--line);background:#fff;border-radius:24px;padding:27px;min-height:190px;overflow:hidden;transition:.3s}.choice:hover{transform:translateY(-6px);box-shadow:var(--shadow)}.choice .num{font-size:11px;color:var(--red);font-weight:900;letter-spacing:.1em}.choice h3{font-family:Manrope;font-size:23px;margin:18px 0 9px}.choice p{color:#707070;line-height:1.6;font-size:13px;max-width:430px}.choice-icon{position:absolute;right:20px;bottom:-10px;font-size:90px;opacity:.08;transform:rotate(-10deg)}
/* products */
.menu-tabs{display:flex;gap:8px;margin-bottom:26px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#fff;padding:11px 15px;border-radius:999px;font-weight:800;color:#666}.tab.active{background:var(--red);border-color:var(--red);color:#fff}.menu-panel{display:none}.menu-panel.active{display:block;animation:fade .4s both}.info-strip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}.info-pill{background:#fff;border:1px solid var(--line);padding:11px 14px;border-radius:13px;font-size:12px;font-weight:700;color:#5f5a5d}.product-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:17px}.product-card{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;transition:.3s;position:relative}.product-card:hover{transform:translateY(-6px);box-shadow:var(--shadow)}.product-img{height:210px;width:100%;object-fit:cover;background:#f8eef0}.product-body{padding:16px}.product-name{font-weight:900;font-size:15px;line-height:1.25}.product-price{color:var(--red);font-weight:900;margin-top:6px}.variant-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:12px;margin-top:12px;border-top:1px solid var(--line)}.variant-row span{font-size:11px;color:#666;font-weight:700}.stepper{display:flex;align-items:center;gap:6px}.stepper button{width:30px;height:30px;border-radius:9px;background:#f8eef0;color:var(--red);font-weight:900}.stepper input{width:34px;text-align:center;border:0;background:transparent;font-weight:900;outline:0}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.chip{border:1px solid var(--line);padding:9px 12px;border-radius:999px;background:#fff;font-size:12px;font-weight:700;cursor:pointer}.chip:has(input:checked){border-color:var(--red);background:var(--soft);color:var(--red)}.chip input{display:none}.order-box{margin-top:28px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:23px}.order-box h3{font-family:Manrope;font-size:20px;margin-bottom:16px}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.field{width:100%;border:1px solid #e8dfe2;border-radius:13px;padding:13px 14px;outline:0;background:#fff}.field:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(169,0,43,.07)}.field.full{grid-column:1/-1}.order-total{display:flex;justify-content:space-between;align-items:center;padding-top:18px;margin-top:18px;border-top:1px solid var(--line);font-weight:900}.order-total strong{color:var(--red);font-size:20px}
/* info */
.info-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px}.info-card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:26px}.info-card h3{font-family:Manrope;font-size:21px;margin-bottom:12px}.info-card p,.info-card li{color:#6b6669;line-height:1.65;font-size:13px}.info-card ul{list-style:none;display:grid;gap:10px}.info-card li{display:flex;gap:9px}.dot{width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:var(--red);margin-top:7px}.whatsapp-card{background:linear-gradient(135deg,#fff,#fff5f7);border-color:#f0d7de}.whatsapp{display:inline-flex;margin-top:18px;background:#168f45;color:#fff;padding:13px 17px;border-radius:13px;font-weight:900}
/* cart */
.cart-bar{position:fixed;left:50%;bottom:18px;transform:translate(-50%,140px);z-index:75;width:min(680px,calc(100% - 24px));background:#151114;color:#fff;border-radius:18px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 22px 60px rgba(0,0,0,.24);transition:.35s}.cart-bar.show{transform:translate(-50%,0)}.cart-info{display:flex;align-items:center;gap:12px}.cart-count{font-size:12px;color:#ddd}.cart-total{font-weight:900}.cart-view{background:var(--red);padding:11px 15px;border-radius:11px;font-weight:900;font-size:12px}
/* admin */
.admin-view{display:none;padding:110px 0 120px;background:#fff7f8;min-height:100vh}.admin-view.show{display:block;animation:fade .4s}.admin-login,.admin-panel{max-width:920px;margin:auto}.admin-login{max-width:420px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow)}.admin-login h2,.admin-panel h2{font-family:Manrope;letter-spacing:-.04em;margin-bottom:8px}.admin-login p{color:#777;font-size:13px;line-height:1.6;margin-bottom:20px}.admin-row{display:flex;gap:10px;flex-wrap:wrap}.admin-row .field{flex:1}.admin-top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:25px}.admin-products{display:grid;gap:12px}.admin-item{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;display:flex;align-items:center;justify-content:space-between;gap:15px}.admin-item-main{display:flex;align-items:center;gap:13px}.admin-item img{width:58px;height:58px;border-radius:12px;object-fit:cover;background:#f5eef0}.admin-item strong{display:block;font-size:14px}.admin-item small{color:#777;font-size:11px}.danger{background:#fff0f2;color:#b00031;padding:10px 13px;border-radius:10px;font-weight:900}.add-box{margin:22px 0;background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px}.admin-status{margin:12px 0;color:#777;font-size:12px}.hide{display:none!important}
footer{padding:45px 0 95px;background:#151114;color:#d9d2d5}.footer-inner{display:flex;justify-content:space-between;gap:30px}.footer-brand{font-family:Manrope;font-weight:900;font-size:20px;color:#fff}.footer-copy{font-size:12px;color:#aaa;max-width:400px;line-height:1.6}
.reveal{opacity:0;transform:translateY(22px);transition:.7s cubic-bezier(.2,.9,.2,1)}.reveal.visible{opacity:1;transform:none}@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}@keyframes heroImg{from{opacity:0;transform:translateX(30px) scale(.96)}to{opacity:1;transform:none}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}@keyframes fade{from{opacity:0}to{opacity:1}}
@media(max-width:900px){.command-choice-grid{grid-template-columns:1fr}.about-grid{grid-template-columns:1fr;gap:35px}.feature-grid{grid-template-columns:1fr 1fr}.order-modal-panel{width:100%;max-height:94vh;border-radius:26px 26px 0 0}}@media(max-width:900px){.hero-inner{grid-template-columns:1fr;min-height:auto}.hero-copy{padding:70px 0 20px}.hero-product{height:430px;margin-top:-15px}.hero-product:before{width:330px;height:330px}.hero-product img{height:390px}.product-grid{grid-template-columns:repeat(2,1fr)}.info-grid{grid-template-columns:1fr}.choice-grid{grid-template-columns:1fr}.header-order{display:none}}
@media(max-width:620px){.feature-grid{grid-template-columns:1fr}.command-choice{min-height:255px;padding:23px}.command-choice h3{font-size:24px}.about-visual,.about-visual img{min-height:360px;height:360px}.order-modal-panel{padding:20px 14px}.order-modal-switch{width:100%}.modal-switch{flex:1}.order-modal-head{margin-bottom:12px}}@media(max-width:620px){.container{width:min(var(--max),calc(100% - 26px))}.topbar{font-size:11px}.header{height:70px}.brand img{width:38px;height:38px}.brand strong{font-size:17px}.hero{min-height:auto}.hero-copy{padding:55px 0 8px}.hero h1{font-size:45px}.hero-sub{font-size:15px}.hero-cta .btn{width:100%}.hero-meta{gap:15px}.hero-product{height:355px}.hero-product:before{width:285px;height:285px}.hero-product img{height:330px}.hero-tag{right:2%;bottom:22px;padding:11px 12px}.section{padding:66px 0}.section-head{display:block}.section-head p{margin-top:12px}.product-grid{grid-template-columns:1fr 1fr;gap:11px}.product-img{height:145px}.product-body{padding:12px}.product-name{font-size:13px}.variant-row{display:block}.stepper{margin-top:7px;justify-content:space-between}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.footer-inner{display:block}.footer-copy{margin-top:12px}.drawer{padding:22px}.admin-top{align-items:flex-start;flex-direction:column}}

/* PWA install prompt */
.install-prompt{position:fixed;left:18px;right:18px;bottom:18px;z-index:120;background:#fff;border:1px solid #eadfe2;border-radius:22px;box-shadow:0 24px 70px rgba(40,5,18,.20);padding:15px 16px;display:flex;align-items:center;gap:14px;transform:translateY(150%);opacity:0;pointer-events:none;transition:.45s cubic-bezier(.2,.9,.2,1);max-width:620px;margin:auto}
.install-prompt.show{transform:none;opacity:1;pointer-events:auto}
.install-icon{width:46px;height:46px;border-radius:14px;object-fit:cover;background:var(--soft);flex:0 0 46px}
.install-copy{min-width:0;flex:1}.install-copy strong{display:block;font-size:14px}.install-copy span{display:block;color:#777;font-size:12px;line-height:1.45;margin-top:3px}
.install-actions{display:flex;gap:7px;align-items:center}.install-btn{background:var(--red);color:#fff;padding:10px 13px;border-radius:11px;font-weight:900;font-size:12px;white-space:nowrap}.install-close{width:34px;height:34px;border-radius:10px;background:#f8eef0;color:var(--red);font-weight:900}
@media(max-width:620px){.install-prompt{left:10px;right:10px;bottom:10px;padding:13px}.install-icon{width:40px;height:40px;flex-basis:40px}.install-copy span{font-size:11px}.install-btn{padding:10px 11px}}

.admin-page{min-height:100vh;background:#fff7f8;padding:40px 0 80px}.admin-wrap{width:min(980px,calc(100% - 28px));margin:auto}.admin-card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:28px;box-shadow:var(--shadow)}.admin-brand{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}.admin-brand h1{font-family:Manrope;font-size:clamp(28px,4vw,44px);letter-spacing:-.05em}.admin-brand p{color:#777;font-size:13px;margin-top:5px}.admin-login{max-width:520px;margin:10vh auto 0}.admin-login h2{font-family:Manrope;font-size:34px;margin:8px 0 10px}.admin-login p{color:#777;line-height:1.6;font-size:13px;margin-bottom:18px}.admin-top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:20px}.admin-top h2{font-family:Manrope;font-size:28px}.admin-actions{display:flex;gap:9px;flex-wrap:wrap}.admin-products{display:grid;gap:10px}.admin-item{display:flex;align-items:center;justify-content:space-between;gap:14px;border:1px solid var(--line);border-radius:17px;padding:12px;background:#fff}.admin-item-main{display:flex;align-items:center;gap:12px;min-width:0}.admin-item img{width:58px;height:58px;object-fit:cover;border-radius:13px;background:#f8eef0}.admin-item strong{display:block;font-size:14px}.admin-item small{display:block;color:#777;margin-top:4px}.danger{background:#fff0f3;color:var(--red);padding:10px 13px;border-radius:11px;font-weight:900}.admin-status{margin-top:12px;color:#777;font-size:13px;min-height:18px}.add-box{margin-top:20px;padding-top:20px;border-top:1px solid var(--line)}.hide{display:none!important}@media(max-width:620px){.admin-page{padding:18px 0 50px}.admin-card{padding:19px}.admin-top{align-items:flex-start;flex-direction:column}.admin-item{align-items:flex-start}.danger{align-self:center}}

.edit-box{margin-top:14px;padding:16px;border-radius:18px;background:#fff7f8;border:1px solid #f1dfe4;display:none}.edit-box.show{display:block;animation:gateIn .25s ease}.edit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.admin-item-actions{display:flex;gap:8px;flex-wrap:wrap}.edit-btn{background:#f6eef1;color:var(--red);padding:10px 13px;border-radius:11px;font-weight:900}.save-btn{background:var(--red);color:#fff;padding:10px 13px;border-radius:11px;font-weight:900}.cancel-btn{background:#fff;border:1px solid var(--line);padding:10px 13px;border-radius:11px;font-weight:800}.admin-thumb{width:74px!important;height:74px!important}.section-label{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#777;margin-bottom:7px}.edit-preview{display:flex;align-items:center;gap:12px;margin-top:10px}.edit-preview img{width:74px;height:74px;object-fit:cover;border-radius:14px;border:1px solid var(--line)}
@media(max-width:620px){.edit-grid{grid-template-columns:1fr}.admin-item-actions{width:100%}.admin-item-actions button{flex:1}}
</style>
</head>
<body>
<main class="admin-page">
<div class="admin-wrap">
<div class="admin-card admin-login" id="adminLogin">
<div class="section-kicker">Espace privé</div><h2>Administration Malé Tacos</h2>
<p>Cette page est séparée du site public. Connecte-toi avec le mot de passe configuré sur le serveur.</p>
<input class="field" id="adminPassword" type="password" placeholder="Mot de passe admin" autocomplete="current-password">
<button class="btn btn-red" id="adminLoginBtn" style="width:100%;margin-top:12px">Se connecter</button>
<div class="admin-status" id="adminLoginStatus"></div>
</div>
<div class="admin-card hide" id="adminPanel">
<div class="admin-top"><div><div class="section-kicker">Gestion du catalogue</div><h2>Produits Malé Tacos</h2></div><div class="admin-actions"><button class="btn btn-light" id="adminRefresh">Actualiser</button><a class="btn btn-red" href="./index.html">Retour au site</a></div></div>
<div class="add-box"><h3 style="font-family:Manrope;margin-bottom:14px">Ajouter un produit</h3>
<div class="fields"><select class="field" id="newCategory"><option value="eleve">Institut Bobokoli</option><option value="exterieur">Extérieur / Livraison</option></select><input class="field" id="newName" placeholder="Nom du produit"><input class="field" id="newPrice" type="number" placeholder="Prix en FC (élève)"><input class="field" id="newImage" placeholder="Image : ex. tacos-viande.jpg ou URL"><input class="field" id="newL" type="number" placeholder="Prix L (livraison)"><input class="field" id="newXL" type="number" placeholder="Prix XL (livraison)"></div>
<button class="btn btn-red" id="addProduct" style="margin-top:13px">Ajouter le produit</button><div class="admin-status" id="adminStatus"></div></div>
<div class="admin-products" id="adminProducts"></div>
</div>
</div>
</main>
<script>
'use strict';
let adminPassword='';
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const fc=n=>Number(n||0).toLocaleString('fr-FR')+' FC';
const productImage=src=>src||'tacos-viande.jpg';
function adminHeaders(){return {'Content-Type':'application/json','x-admin-password':adminPassword}}

async function adminLogin(){
  const p=$('#adminPassword').value;if(!p)return;
  $('#adminLoginStatus').textContent='Connexion…';
  try{
    const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});
    if(!r.ok)throw new Error('Mot de passe incorrect');
    adminPassword=p;$('#adminLogin').classList.add('hide');$('#adminPanel').classList.remove('hide');
    $('#adminLoginStatus').textContent='';await adminLoad();
  }catch(e){$('#adminLoginStatus').textContent=e.message||'Connexion impossible.'}
}
$('#adminLoginBtn').onclick=adminLogin;
$('#adminPassword').addEventListener('keydown',e=>{if(e.key==='Enter')adminLogin()});

function editForm(p){
  const isEleve=p.category==='eleve';
  const variants=p.variants||[];
  const L=variants.find(v=>v.size==='L')?.price||'';
  const XL=variants.find(v=>v.size==='XL')?.price||'';
  return `<div class="edit-box" id="edit-${esc(p.category)}-${esc(p.id)}">
    <div class="section-label">Modifier le produit</div>
    <div class="edit-grid">
      <input class="field" id="name-${esc(p.category)}-${esc(p.id)}" value="${esc(p.name)}" placeholder="Nom du produit">
      <input class="field" id="image-${esc(p.category)}-${esc(p.id)}" value="${esc(p.image||'')}" placeholder="Image : tacos.jpg ou URL">
      ${isEleve?`<input class="field" id="price-${esc(p.category)}-${esc(p.id)}" type="number" value="${Number(p.price||0)}" placeholder="Prix en FC">`:`<input class="field" id="L-${esc(p.category)}-${esc(p.id)}" type="number" value="${L}" placeholder="Prix L en FC"><input class="field" id="XL-${esc(p.category)}-${esc(p.id)}" type="number" value="${XL}" placeholder="Prix XL en FC">`}
    </div>
    <div class="edit-preview"><img id="preview-${esc(p.category)}-${esc(p.id)}" src="${esc(productImage(p.image))}" alt=""><span style="font-size:12px;color:#777">Aperçu de l'image</span></div>
    <div class="admin-item-actions" style="margin-top:12px">
      <button class="save-btn" data-save-cat="${esc(p.category)}" data-save-id="${esc(p.id)}">Enregistrer les modifications</button>
      <button class="cancel-btn" data-cancel="${esc(p.category)}-${esc(p.id)}">Annuler</button>
    </div>
    <div class="admin-status" id="status-${esc(p.category)}-${esc(p.id)}"></div>
  </div>`;
}

async function adminLoad(){
  const box=$('#adminProducts');box.innerHTML='<div class="admin-status">Chargement…</div>';
  try{
    const r=await fetch('/api/products',{cache:'no-store'});if(!r.ok)throw new Error('Impossible de charger les produits');
    const d=await r.json();
    const all=[...(d.eleve||[]).map(p=>({...p,category:'eleve'})),...(d.exterieur||[]).map(p=>({...p,category:'exterieur'}))];
    box.innerHTML=all.map(p=>`
      <div class="admin-item-wrap">
        <div class="admin-item">
          <div class="admin-item-main">
            <img class="admin-thumb" src="${esc(productImage(p.image))}" alt="">
            <div><strong>${esc(p.name)}</strong><small>${p.category==='eleve'?fc(p.price):(p.variants||[]).map(v=>v.size+' '+fc(v.price)).join(' · ')}</small></div>
          </div>
          <div class="admin-item-actions">
            <button class="edit-btn" data-edit-cat="${esc(p.category)}" data-edit-id="${esc(p.id)}">Modifier</button>
            <button class="danger" data-delete-cat="${esc(p.category)}" data-delete-id="${esc(p.id)}">Supprimer</button>
          </div>
        </div>
        ${editForm(p)}
      </div>`).join('')||'<div class="admin-status">Aucun produit.</div>';

    document.querySelectorAll('[data-edit-id]').forEach(b=>b.onclick=()=>toggleEdit(b.dataset.editCat,b.dataset.editId));
    document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{const el=$('#edit-'+b.dataset.cancel);el?.classList.remove('show')});
    document.querySelectorAll('[data-save-id]').forEach(b=>b.onclick=()=>adminUpdate(b.dataset.saveCat,b.dataset.saveId,b));
    document.querySelectorAll('[data-delete-id]').forEach(b=>b.onclick=()=>adminDelete(b.dataset.deleteCat,b.dataset.deleteId,b));
    document.querySelectorAll('input[id^="image-"]').forEach(i=>i.addEventListener('input',()=>{
      const parts=i.id.split('-');const cat=parts[1],id=parts.slice(2).join('-');const preview=$('#preview-'+cat+'-'+id);if(preview)preview.src=i.value||'tacos-viande.jpg';
    }));
  }catch(e){box.innerHTML='<div class="admin-status">'+esc(e.message)+'</div>'}
}

function toggleEdit(category,id){
  const box=$('#edit-'+category+'-'+id);if(!box)return;
  document.querySelectorAll('.edit-box.show').forEach(x=>x!==box&&x.classList.remove('show'));
  box.classList.toggle('show');
}

async function adminUpdate(category,id,btn){
  const key=category+'-'+id;
  const status=$('#status-'+key);btn.disabled=true;status.textContent='Enregistrement…';
  const body={name:$('#name-'+key).value.trim(),image:$('#image-'+key).value.trim()};
  if(!body.name){status.textContent='Le nom est obligatoire.';btn.disabled=false;return}
  if(category==='eleve'){
    const price=Number($('#price-'+key).value);if(!price){status.textContent='Le prix est obligatoire.';btn.disabled=false;return}body.price=price;
  }else{
    const L=Number($('#L-'+key).value),XL=Number($('#XL-'+key).value);body.variants=[];if(L)body.variants.push({size:'L',price:L});if(XL)body.variants.push({size:'XL',price:XL});
    if(!body.variants.length){status.textContent='Ajoute au moins un prix L ou XL.';btn.disabled=false;return}
  }
  try{
    const r=await fetch('/api/admin/products/'+category+'/'+encodeURIComponent(id),{method:'PUT',headers:adminHeaders(),body:JSON.stringify(body)});
    const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Modification impossible');
    status.textContent='Modifications enregistrées.';await adminLoad();
  }catch(e){status.textContent=e.message||'Modification impossible.';btn.disabled=false}
}

async function adminDelete(category,id,btn){
  if(!confirm('Supprimer ce produit ?'))return;btn.disabled=true;
  try{
    const r=await fetch('/api/admin/products/'+category+'/'+encodeURIComponent(id),{method:'DELETE',headers:adminHeaders()});
    if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||'Suppression impossible');await adminLoad();
  }catch(e){alert(e.message);btn.disabled=false}
}
$('#adminRefresh').onclick=adminLoad;

$('#addProduct').onclick=async()=>{
  const cat=$('#newCategory').value,name=$('#newName').value.trim(),image=$('#newImage').value.trim()||'tacos-viande.jpg';
  if(!name){alert('Ajoute un nom de produit.');return}
  let body={id:'p'+Date.now(),name,image};
  if(cat==='eleve'){
    const price=Number($('#newPrice').value);if(!price){alert('Ajoute le prix.');return}body.price=price;
  }else{
    const L=Number($('#newL').value),XL=Number($('#newXL').value);if(!L&&!XL){alert('Ajoute au moins un prix L ou XL.');return}
    body.variants=[];if(L)body.variants.push({size:'L',price:L});if(XL)body.variants.push({size:'XL',price:XL});
  }
  const s=$('#adminStatus');s.textContent='Ajout en cours…';
  try{
    const r=await fetch('/api/admin/products/'+cat,{method:'POST',headers:adminHeaders(),body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error||'Ajout impossible');
    $('#newName').value='';$('#newPrice').value='';$('#newImage').value='';$('#newL').value='';$('#newXL').value='';s.textContent='Produit ajouté.';await adminLoad();
  }catch(e){s.textContent=e.message}
};
</script>
</body>
</html>
